<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#101118"/>
      <stop offset="100%" stop-color="#0C0D12"/>
    </linearGradient>
    <linearGradient id="reelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1C26"/>
      <stop offset="100%" stop-color="#13141B"/>
    </linearGradient>
    <filter id="reelShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0,140 L 1920,140 M 0,280 L 1920,280 M 0,420 L 1920,420 M 0,560 L 1920,560 M 0,700 L 1920,700 M 0,840 L 1920,840 M 0,980 L 1920,980"/>
    <path d="M 280,0 L 280,1080 M 560,0 L 560,1080 M 840,0 L 840,1080 M 1120,0 L 1120,1080 M 1400,0 L 1400,1080 M 1680,0 L 1680,1080"/>
  </g>

  <!-- Top Bar -->
  <g transform="translate(100, 70)">
    <rect width="42" height="42" rx="10" fill="url(#reelGrad)"/>
    <polygon points="18,14 18,28 29,21" fill="#FFFFFF"/>
    <text x="60" y="26" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="1">AUTOMATED NEWS-TO-REELS RENDERING PIPELINE</text>
    <text x="60" y="50" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Autonomous RSS Monitoring, Voiceover Synthesis, Dynamic 9:16 Kinetic Video Composition</text>
    <rect x="1450" y="10" width="270" height="36" rx="18" fill="#831843" fill-opacity="0.4" stroke="#F43F5E" stroke-width="1"/>
    <circle cx="1470" cy="28" r="6" fill="#FB7185"/>
    <text x="1486" y="33" fill="#FECDD3" font-family="'Inter', sans-serif" font-size="13" font-weight="700">AUTONOMOUS GENERATION: LIVE</text>
  </g>

  <!-- Connectors -->
  <path d="M 460,450 L 570,450" stroke="#EC4899" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M 950,450 L 1050,450" stroke="#EC4899" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M 1430,450 L 1510,450" stroke="#10B981" stroke-width="3"/>

  <!-- Step 1: News Crawl & Story Summarizer -->
  <g transform="translate(100, 210)" filter="url(#reelShadow)">
    <rect width="360" height="580" rx="16" fill="url(#cardBg)" stroke="#33384B" stroke-width="1.5"/>
    <rect width="360" height="60" rx="16" fill="#181B26"/>
    <rect x="0" y="50" width="360" height="10" fill="#181B26"/>
    <text x="24" y="36" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="16" font-weight="700">01. CRAWL &amp; LLM SCRIPTING</text>

    <!-- Source Ingest -->
    <rect x="24" y="85" width="312" height="135" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="44" y="115" fill="#F472B6" font-family="'Inter', sans-serif" font-size="12" font-weight="600">INPUT FEEDS (RSS &amp; WIRE)</text>
    <text x="44" y="140" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Tech &amp; Market Breakers</text>
    <text x="44" y="165" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">15-minute polling interval</text>
    <text x="44" y="195" fill="#EC4899" font-family="'JetBrains Mono', monospace" font-size="11">status: 200 OK • 14 headlines ingested</text>

    <!-- Script Output -->
    <rect x="24" y="240" width="312" height="305" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="44" y="270" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">VIRAL 45s SCRIPT GENERATION</text>
    <rect x="44" y="285" width="272" height="240" rx="8" fill="#151822"/>
    <g font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">
      <text x="56" y="310" fill="#F472B6" font-weight="700">[HOOK - 0:00-0:03]</text>
      <text x="56" y="330">"This AI startup just replaced</text>
      <text x="56" y="348">an entire film crew in 8 hours."</text>
      
      <text x="56" y="380" fill="#38BDF8" font-weight="700">[BODY - 0:04-0:35]</text>
      <text x="56" y="400">"Using generative video pipelines,</text>
      <text x="56" y="418">autonomous production costs</text>
      <text x="56" y="436">plummeted by 92% this month..."</text>

      <text x="56" y="468" fill="#34D399" font-weight="700">[CALL TO ACTION - 0:36-0:45]</text>
      <text x="56" y="488">"Save this reel to explore the full breakdown."</text>
    </g>
  </g>

  <!-- Step 2: Voiceover & Audio Engine -->
  <g transform="translate(580, 190)" filter="url(#reelShadow)">
    <rect width="370" height="620" rx="16" fill="url(#cardBg)" stroke="#EC4899" stroke-width="2"/>
    <rect width="370" height="60" rx="16" fill="#831843" fill-opacity="0.3"/>
    <rect x="0" y="50" width="370" height="10" fill="#831843" fill-opacity="0.3"/>
    <text x="24" y="36" fill="#F472B6" font-family="'Inter', sans-serif" font-size="16" font-weight="800">02. VOICE &amp; TIMELINE ENGINE</text>

    <!-- ElevenLabs Card -->
    <rect x="24" y="85" width="322" height="155" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="44" y="115" fill="#F472B6" font-family="'Inter', sans-serif" font-size="12" font-weight="700">NEURAL TTS SYNTHESIS</text>
    <rect x="44" y="130" width="282" height="50" rx="6" fill="#20152B"/>
    <text x="56" y="152" fill="#D8B4FE" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Voice: ElevenLabs Adam (Deep &amp; Punchy)</text>
    <text x="56" y="170" fill="#A855F7" font-family="'Inter', sans-serif" font-size="11">Clarity: 92% • Stability: 78%</text>

    <!-- Waveform Visual -->
    <g transform="translate(44, 195)">
      <rect x="0" y="15" width="4" height="20" rx="2" fill="#EC4899"/>
      <rect x="8" y="8" width="4" height="34" rx="2" fill="#EC4899"/>
      <rect x="16" y="2" width="4" height="46" rx="2" fill="#EC4899"/>
      <rect x="24" y="10" width="4" height="30" rx="2" fill="#EC4899"/>
      <rect x="32" y="20" width="4" height="10" rx="2" fill="#EC4899"/>
      <rect x="40" y="5" width="4" height="40" rx="2" fill="#EC4899"/>
      <rect x="48" y="0" width="4" height="50" rx="2" fill="#EC4899"/>
      <rect x="56" y="12" width="4" height="26" rx="2" fill="#EC4899"/>
      <rect x="64" y="22" width="4" height="6" rx="2" fill="#EC4899"/>
      <rect x="72" y="4" width="4" height="42" rx="2" fill="#EC4899"/>
      <rect x="80" y="14" width="4" height="22" rx="2" fill="#EC4899"/>
      <rect x="88" y="2" width="4" height="46" rx="2" fill="#EC4899"/>
      <rect x="96" y="18" width="4" height="14" rx="2" fill="#EC4899"/>
      <rect x="104" y="6" width="4" height="38" rx="2" fill="#EC4899"/>
      <rect x="112" y="0" width="4" height="50" rx="2" fill="#EC4899"/>
      <rect x="120" y="10" width="4" height="30" rx="2" fill="#EC4899"/>
      <rect x="128" y="20" width="4" height="10" rx="2" fill="#EC4899"/>
      <rect x="136" y="5" width="4" height="40" rx="2" fill="#EC4899"/>
      <rect x="144" y="12" width="4" height="26" rx="2" fill="#EC4899"/>
      <rect x="152" y="4" width="4" height="42" rx="2" fill="#EC4899"/>
      <rect x="160" y="16" width="4" height="18" rx="2" fill="#EC4899"/>
      <rect x="168" y="8" width="4" height="34" rx="2" fill="#EC4899"/>
      <rect x="176" y="2" width="4" height="46" rx="2" fill="#EC4899"/>
      <rect x="184" y="10" width="4" height="30" rx="2" fill="#EC4899"/>
      <rect x="192" y="20" width="4" height="10" rx="2" fill="#EC4899"/>
      <rect x="200" y="5" width="4" height="40" rx="2" fill="#EC4899"/>
      <rect x="208" y="0" width="4" height="50" rx="2" fill="#EC4899"/>
      <rect x="216" y="12" width="4" height="26" rx="2" fill="#EC4899"/>
      <rect x="224" y="22" width="4" height="6" rx="2" fill="#EC4899"/>
      <rect x="232" y="4" width="4" height="42" rx="2" fill="#EC4899"/>
      <rect x="240" y="14" width="4" height="22" rx="2" fill="#EC4899"/>
      <rect x="248" y="2" width="4" height="46" rx="2" fill="#EC4899"/>
      <rect x="256" y="18" width="4" height="14" rx="2" fill="#EC4899"/>
      <rect x="264" y="6" width="4" height="38" rx="2" fill="#EC4899"/>
      <rect x="272" y="0" width="4" height="50" rx="2" fill="#EC4899"/>
    </g>

    <!-- Word Timestamp Alignment (Whisper) -->
    <rect x="24" y="265" width="322" height="165" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="44" y="295" fill="#F472B6" font-family="'Inter', sans-serif" font-size="12" font-weight="700">WORD-LEVEL TIMECODE ALIGNMENT</text>
    <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
      <text x="44" y="325">[00:00.12] &quot;This&quot; (confidence: 0.99)</text>
      <text x="44" y="350">[00:00.35] &quot;AI&quot; (highlight: #FBBF24)</text>
      <text x="44" y="375">[00:00.62] &quot;STARTUP&quot; (scale: 1.25)</text>
      <text x="44" y="400">[00:01.05] &quot;just replaced...&quot;</text>
    </g>
    <text x="44" y="420" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">✓ Precision sync down to 10 milliseconds</text>

    <!-- Background Ducking -->
    <rect x="24" y="450" width="322" height="145" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="44" y="480" fill="#F472B6" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SOUNDTRACK AUTO-DUCKING</text>
    <text x="44" y="510" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Cyberpunk Lo-Fi Beat (-18dB during voiceover)</text>
    <text x="44" y="535" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Sidechain compressor enabled</text>
    <text x="44" y="560" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12">✓ Royalty-free track library auto-selected</text>
  </g>

  <!-- Step 3: Vertical Video Preview Mockup -->
  <g transform="translate(1060, 200)" filter="url(#reelShadow)">
    <rect width="360" height="590" rx="20" fill="#0B0C10" stroke="#33384B" stroke-width="2"/>
    
    <!-- Phone Screen Mockup (9:16) -->
    <rect x="30" y="25" width="300" height="535" rx="16" fill="#141721" stroke="#3B82F6" stroke-width="1.5"/>
    
    <!-- Video background simulation -->
    <rect x="30" y="25" width="300" height="535" rx="16" fill="#181B28"/>
    <circle cx="180" cy="220" r="70" fill="url(#reelGrad)" fill-opacity="0.3"/>
    
    <!-- Top badge -->
    <rect x="50" y="50" width="100" height="24" rx="12" fill="#EF4444"/>
    <text x="65" y="66" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="800">BREAKING TECH</text>

    <!-- Kinetic Captions in Middle -->
    <g transform="translate(180, 270)" text-anchor="middle">
      <rect x="-120" y="-20" width="240" height="42" rx="8" fill="#FACC15"/>
      <text x="0" y="8" fill="#000000" font-family="'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="1">REPLACED FILM CREW</text>
      <text x="0" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="16" font-weight="700">IN UNDER 8 HOURS</text>
    </g>

    <!-- Bottom Audio & Channel Info -->
    <g transform="translate(50, 480)">
      <circle cx="16" cy="16" r="16" fill="#6366F1"/>
      <text x="42" y="16" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">@AutomatedByte</text>
      <text x="42" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">♫ Original Audio • AI Produced</text>
    </g>

    <!-- Right Side Engagement Bar -->
    <g transform="translate(300, 340)">
      <circle cx="12" cy="0" r="14" fill="#1E2333"/>
      <text x="12" y="20" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">48.2k</text>
      <circle cx="12" cy="45" r="14" fill="#1E2333"/>
      <text x="12" y="65" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">1.2k</text>
      <circle cx="12" cy="90" r="14" fill="#1E2333"/>
      <text x="12" y="110" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">8.9k</text>
    </g>
  </g>

  <!-- Step 4: Multi-Channel Dispatch -->
  <g transform="translate(1480, 210)" filter="url(#reelShadow)">
    <rect width="340" height="580" rx="16" fill="url(#cardBg)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="340" height="60" rx="16" fill="#064E3B" fill-opacity="0.3"/>
    <rect x="0" y="50" width="340" height="10" fill="#064E3B" fill-opacity="0.3"/>
    <text x="24" y="36" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="16" font-weight="700">04. AUTONOMOUS PUBLISH</text>

    <!-- Channels -->
    <rect x="20" y="85" width="300" height="75" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="36" y="115" fill="#EF4444" font-family="'Inter', sans-serif" font-size="14" font-weight="700">YouTube Shorts API</text>
    <text x="36" y="140" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Scheduled 12:00 PM EST (Peak)</text>

    <rect x="20" y="170" width="300" height="75" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="36" y="200" fill="#EC4899" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Instagram Reels Graph API</text>
    <text x="36" y="225" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Cover thumbnail auto-selected</text>

    <rect x="20" y="255" width="300" height="75" rx="10" fill="#0D0F17" stroke="#252A3B"/>
    <text x="36" y="285" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700">TikTok Content Posting API</text>
    <text x="36" y="310" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Hashtags and viral hooks synced</text>

    <!-- Performance Summary -->
    <rect x="20" y="345" width="300" height="200" rx="10" fill="#121520" stroke="#252A3B"/>
    <text x="36" y="375" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">SYSTEM PERFORMANCE</text>
    <text x="36" y="410" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="28" font-weight="800">12 min</text>
    <text x="140" y="410" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">End-to-End Render</text>

    <text x="36" y="460" fill="#34D399" font-family="'Inter', sans-serif" font-size="28" font-weight="800">100%</text>
    <text x="140" y="460" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Hands-Free Automation</text>

    <text x="36" y="505" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Over 90 videos delivered per month</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(100, 930)">
    <rect width="1720" height="60" rx="12" fill="#12141A" stroke="#262B35"/>
    <text x="30" y="36" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" font-weight="600">STACK &amp; RUNTIME:</text>
    <text x="175" y="36" fill="#EC4899" font-family="'JetBrains Mono', monospace" font-size="13">Node.js Remotion • FFmpeg WebAssembly • ElevenLabs Voice API • OpenAI GPT-4o • AWS S3 • YouTube / IG API</text>
  </g>
</svg>
