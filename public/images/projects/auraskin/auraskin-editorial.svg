<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="50%" stop-color="#1C1A17"/>
      <stop offset="100%" stop-color="#11100F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C99A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7A36"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262320"/>
      <stop offset="100%" stop-color="#181614"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle Top Decorative Grid -->
  <g opacity="0.08" stroke="#E2C99A" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1080"/>
    <line x1="680" y1="0" x2="680" y2="1080"/>
    <line x1="1240" y1="0" x2="1240" y2="1080"/>
    <line x1="1840" y1="0" x2="1840" y2="1080"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
  </g>

  <!-- Top Editorial Header -->
  <text x="120" y="90" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#E2C99A" letter-spacing="8">AURASKIN BOTANICALS</text>
  <text x="1920" y="90" text-anchor="end" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#8C827A" letter-spacing="4" transform="translate(-120, 0)">EDITORIAL CAMPAIGN • Q4 LAUNCH SUITE</text>

  <!-- Card 1: Brand Philosophy & Clinical Data -->
  <g transform="translate(120, 160)" filter="url(#shadow)">
    <rect width="520" height="780" rx="16" fill="url(#cardGrad)" stroke="#38332E" stroke-width="1.5"/>
    <text x="50" y="80" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#C5A059" letter-spacing="4">CLINICAL EFFICACY</text>
    <text x="50" y="140" font-family="'Cinzel', Georgia, serif" font-size="42" font-weight="700" fill="#F5EFEB" letter-spacing="1">Cellular Bio-Renewal</text>
    <text x="50" y="180" font-family="-apple-system, sans-serif" font-size="16" fill="#A89E94" line-height="24">Formulated with pure Bakuchiol, cold-pressed Rosehip, and bioactive squalane.</text>

    <!-- Stat 1 -->
    <g transform="translate(50, 250)">
      <text x="0" y="60" font-family="'Cinzel', Georgia, serif" font-size="72" font-weight="800" fill="url(#gold)">98%</text>
      <text x="0" y="100" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#EFE8E2">Skin Elasticity Improvement</text>
      <text x="0" y="125" font-family="-apple-system, sans-serif" font-size="13" fill="#8C827A">Double-blind clinical study over 28 days</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(50, 420)">
      <text x="0" y="60" font-family="'Cinzel', Georgia, serif" font-size="72" font-weight="800" fill="url(#gold)">3.4x</text>
      <text x="0" y="100" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#EFE8E2">Moisture Retention Increase</text>
      <text x="0" y="125" font-family="-apple-system, sans-serif" font-size="13" fill="#8C827A">Compared to unassisted skin barrier baseline</text>
    </g>

    <!-- Ingredient Pills -->
    <g transform="translate(50, 620)">
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#181614" stroke="#4A423A"/>
      <text x="60" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#E2C99A" font-weight="600">Bakuchiol</text>

      <rect x="135" y="0" width="130" height="36" rx="18" fill="#181614" stroke="#4A423A"/>
      <text x="200" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#E2C99A" font-weight="600">Wild Rosehip</text>

      <rect x="280" y="0" width="125" height="36" rx="18" fill="#181614" stroke="#4A423A"/>
      <text x="342" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#E2C99A" font-weight="600">Bio-Squalane</text>
    </g>
  </g>

  <!-- Card 2: Hero Visual Composition Centerpiece -->
  <g transform="translate(680, 160)" filter="url(#shadow)">
    <rect width="560" height="780" rx="16" fill="#161413" stroke="#C5A059" stroke-width="2"/>
    
    <!-- Central Luxury Serum Graphic -->
    <circle cx="280" cy="360" r="190" fill="#1F1C19" stroke="#38332E" stroke-width="2"/>
    <circle cx="280" cy="360" r="140" fill="#292521"/>
    
    <!-- Serum Dropper & Bottle Silhouette Graphic -->
    <g transform="translate(280, 350)">
      <!-- Dropper Cap -->
      <rect x="-18" y="-190" width="36" height="50" rx="18" fill="#E2C99A"/>
      <rect x="-24" y="-140" width="48" height="25" rx="4" fill="#C5A059"/>
      <!-- Bottle Body -->
      <rect x="-65" y="-115" width="130" height="220" rx="20" fill="#B36B22" opacity="0.95"/>
      <rect x="-60" y="-110" width="120" height="210" rx="16" fill="#8A4A10" opacity="0.8"/>
      <!-- Label -->
      <rect x="-50" y="-70" width="100" height="130" rx="6" fill="#F7F2EC"/>
      <text x="0" y="-35" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="800" fill="#26211C" letter-spacing="2">AURASKIN</text>
      <line x1="-30" y1="-22" x2="30" y2="-22" stroke="#C5A059" stroke-width="1.5"/>
      <text x="0" y="-5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#5E5347" letter-spacing="1">CELLULAR RENEWAL</text>
      <text x="0" y="12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" fill="#8C827A">RADIANCE SERUM</text>
      <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#26211C">30 ml • 1.0 fl oz</text>
    </g>

    <text x="280" y="630" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="32" font-weight="700" fill="#F5EFEB" letter-spacing="2">Pure Botanical Science</text>
    <text x="280" y="670" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" fill="#C5A059" letter-spacing="3">COLD-PRESSED • PARABEN-FREE • CRUELTY-FREE</text>
    <text x="280" y="710" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#8C827A">Designed for international luxury retail &amp; premium e-commerce</text>
  </g>

  <!-- Card 3: Social Media & Packaging System -->
  <g transform="translate(1280, 160)" filter="url(#shadow)">
    <rect width="520" height="780" rx="16" fill="url(#cardGrad)" stroke="#38332E" stroke-width="1.5"/>

    <!-- Social Campaign Card 1 -->
    <g transform="translate(50, 60)">
      <rect width="420" height="200" rx="12" fill="#1C1A17" stroke="#332E29"/>
      <rect x="25" y="25" width="150" height="150" rx="8" fill="#292521"/>
      <!-- Bottle mini graphic -->
      <circle cx="100" cy="100" r="45" fill="#8A4A10" opacity="0.6"/>
      <rect x="88" y="70" width="24" height="60" rx="6" fill="#E2C99A"/>
      <text x="200" y="65" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#C5A059" letter-spacing="2">INSTAGRAM AD #01</text>
      <text x="200" y="98" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#F5EFEB">Awaken Cellular Radiance</text>
      <text x="200" y="130" font-family="-apple-system, sans-serif" font-size="13" fill="#8C827A">4:5 Portrait Grid Format</text>
    </g>

    <!-- Social Campaign Card 2 -->
    <g transform="translate(50, 290)">
      <rect width="420" height="200" rx="12" fill="#1C1A17" stroke="#332E29"/>
      <rect x="25" y="25" width="150" height="150" rx="8" fill="#292521"/>
      <circle cx="100" cy="100" r="45" fill="#3D372E"/>
      <text x="100" y="105" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#E2C99A">BOX</text>
      <text x="200" y="65" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#C5A059" letter-spacing="2">PACKAGING SUITE</text>
      <text x="200" y="98" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#F5EFEB">Foil-Embossed Outer Box</text>
      <text x="200" y="130" font-family="-apple-system, sans-serif" font-size="13" fill="#8C827A">Sustainable FSC Certified Kraft</text>
    </g>

    <!-- Brand Typography Palette -->
    <g transform="translate(50, 520)">
      <text x="0" y="30" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#C5A059" letter-spacing="3">TYPOGRAPHY HIERARCHY</text>
      <text x="0" y="70" font-family="'Cinzel', Georgia, serif" font-size="24" fill="#F5EFEB">Cinzel Decorative Display</text>
      <text x="0" y="105" font-family="-apple-system, sans-serif" font-size="14" fill="#A89E94">Inter &amp; Plus Jakarta Sans for Clinical Precision</text>
      
      <!-- Palette Swatches -->
      <g transform="translate(0, 135)">
        <circle cx="20" cy="20" r="18" fill="#1C1A17" stroke="#4A423A"/>
        <circle cx="70" cy="20" r="18" fill="#C5A059"/>
        <circle cx="120" cy="20" r="18" fill="#E2C99A"/>
        <circle cx="170" cy="20" r="18" fill="#B36B22"/>
        <circle cx="220" cy="20" r="18" fill="#F5EFEB"/>
      </g>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <text x="120" y="1020" font-family="-apple-system, sans-serif" font-size="13" fill="#6B625A">Concept Project • Creative Direction &amp; Packaging Architecture by Muhammad Ahsan Sagheer</text>
  <text x="1920" y="1020" text-anchor="end" font-family="-apple-system, sans-serif" font-size="13" fill="#6B625A" transform="translate(-120, 0)">© 2026 AURASKIN • ALL DESIGN RIGHTS RESERVED</text>
</svg>
